name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build FocusBar.sln -c Release

      - name: Test
        run: dotnet test tests/FocusBar.Core.Tests -c Release --no-build

      # Everything below packages FocusBar for testers: a portable zip and an installer, both self-contained
      # (no .NET needed on the PC). Download them from this run's "Artifacts" section.
      - name: Publish
        run: dotnet publish src/FocusBar.App -c Release -r win-x64 --self-contained -o publish

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" packaging/FocusBar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The zip gets the read-me and the FocusBar.portable marker (which makes running it install or update the one
      # FocusBar in %LocalAppData%\Programs\FocusBar). The installer above must not have the marker.
      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item -Recurse publish portable
          Copy-Item packaging/README-FIRST.txt, packaging/FocusBar.portable portable/
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path portable/* -DestinationPath "dist/FocusBar-${{ steps.version.outputs.value }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FocusBar-${{ steps.version.outputs.value }}-windows
          path: dist/
          if-no-files-found: error
