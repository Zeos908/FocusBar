name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build FocusBar.sln -c Release

      - name: Test
        run: dotnet test tests/FocusBar.Core.Tests -c Release --no-build
